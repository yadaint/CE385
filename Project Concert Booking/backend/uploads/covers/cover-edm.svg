<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#020617"/>
      <stop offset="0.5" stop-color="#4c1d95"/>
      <stop offset="1" stop-color="#0e7490"/>
    </linearGradient>
    <linearGradient id="grid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0.05"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#sky)"/>

  <!-- พระอาทิตย์นีออน -->
  <circle cx="600" cy="300" r="150" fill="none" stroke="#f0abfc" stroke-width="6" opacity="0.9"/>
  <circle cx="600" cy="300" r="110" fill="none" stroke="#22d3ee" stroke-width="4" opacity="0.7"/>
  <rect x="430" y="292" width="340" height="16" fill="#020617" opacity="0.9"/>
  <rect x="450" y="322" width="300" height="12" fill="#020617" opacity="0.7"/>

  <!-- พื้นกริด perspective -->
  <g stroke="url(#grid)" stroke-width="2">
    <line x1="600" y1="430" x2="0" y2="675"/>
    <line x1="600" y1="430" x2="300" y2="675"/>
    <line x1="600" y1="430" x2="600" y2="675"/>
    <line x1="600" y1="430" x2="900" y2="675"/>
    <line x1="600" y1="430" x2="1200" y2="675"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
    <line x1="100" y1="545" x2="1100" y2="545"/>
    <line x1="220" y1="600" x2="980" y2="600"/>
  </g>

  <!-- ดีเจ + โต๊ะ -->
  <g transform="translate(600,430)">
    <rect x="-90" y="-10" width="180" height="26" rx="6" fill="#0f172a" stroke="#22d3ee" stroke-width="3"/>
    <rect x="-60" y="-58" width="120" height="48" rx="6" fill="#1e293b" stroke="#f0abfc" stroke-width="3"/>
    <circle cx="-34" cy="-34" r="14" fill="none" stroke="#f0abfc" stroke-width="3"/>
    <circle cx="34" cy="-34" r="14" fill="none" stroke="#22d3ee" stroke-width="3"/>
    <circle cx="-34" cy="-34" r="4" fill="#f0abfc"/>
    <circle cx="34" cy="-34" r="4" fill="#22d3ee"/>
    <circle cx="0" cy="-92" r="22" fill="#0f172a" stroke="#f0abfc" stroke-width="3"/>
  </g>

  <!-- ประกายไฟ -->
  <g fill="#f0abfc">
    <circle cx="150" cy="150" r="4"/><circle cx="250" cy="90" r="3"/><circle cx="1050" cy="120" r="4"/>
    <circle cx="1120" cy="260" r="3"/><circle cx="90" cy="300" r="3"/><circle cx="480" cy="120" r="3"/>
    <circle cx="760" cy="90" r="4"/><circle cx="1000" cy="420" r="3"/><circle cx="200" cy="420" r="3"/>
  </g>

  <text x="600" y="90" text-anchor="middle" font-family="Arial Black, Arial" font-size="58" font-weight="900" fill="#f0abfc" letter-spacing="6">NEON PULSE</text>
  <text x="600" y="640" text-anchor="middle" font-family="Arial" font-size="30" font-weight="700" fill="#22d3ee" letter-spacing="12">EDM FESTIVAL</text>
</svg>
