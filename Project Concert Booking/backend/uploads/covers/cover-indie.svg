<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#134e4a"/>
      <stop offset="0.45" stop-color="#ea580c"/>
      <stop offset="0.75" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#fef3c7"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#sky)"/>

  <!-- พระอาทิตย์ขึ้น -->
  <circle cx="600" cy="430" r="120" fill="#fff7ed" opacity="0.95"/>
  <circle cx="600" cy="430" r="160" fill="#ffedd5" opacity="0.35"/>

  <!-- ภูเขาสองชั้น -->
  <path d="M0 470 L260 330 L520 470 Z" fill="#0f766e" opacity="0.75"/>
  <path d="M380 470 L620 300 L860 470 Z" fill="#115e59" opacity="0.85"/>
  <path d="M720 470 L960 340 L1200 470 Z" fill="#0f766e" opacity="0.75"/>
  <rect x="0" y="468" width="1200" height="60" fill="#134e4a"/>

  <!-- ธงเฟสติวัล -->
  <g stroke="#78350f" stroke-width="4" stroke-linecap="round">
    <line x1="150" y1="470" x2="150" y2="380"/>
    <line x1="260" y1="470" x2="260" y2="395"/>
    <line x1="940" y1="470" x2="940" y2="380"/>
    <line x1="1050" y1="470" x2="1050" y2="395"/>
  </g>
  <g>
    <path d="M150 380 L210 392 L150 404 Z" fill="#f97316"/>
    <path d="M260 395 L312 405 L260 415 Z" fill="#facc15"/>
    <path d="M940 380 L1000 392 L940 404 Z" fill="#22d3ee"/>
    <path d="M1050 395 L1102 405 L1050 415 Z" fill="#f9a8d4"/>
  </g>

  <!-- เต็นท์แคมป์ซิลเวอร์เตต์ -->
  <g transform="translate(0,470)">
    <path d="M80 205 L135 130 L190 205 Z" fill="#7c2d12" stroke="#fed7aa" stroke-width="3"/>
    <path d="M112 205 L135 150 L158 205 Z" fill="#fdba74" opacity="0.5"/>
    <path d="M990 205 L1045 132 L1100 205 Z" fill="#7c2d12" stroke="#fed7aa" stroke-width="3"/>
    <path d="M1022 205 L1045 152 L1068 205 Z" fill="#fdba74" opacity="0.5"/>
    <rect x="480" y="150" width="90" height="120" rx="8" fill="#78350f" stroke="#fde68a" stroke-width="3"/>
    <rect x="498" y="170" width="54" height="100" fill="#134e4a" opacity="0.8"/>
  </g>

  <!-- ฝูงนก -->
  <g stroke="#fff7ed" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M300 180 q12 -12 24 0 q12 -12 24 0"/>
    <path d="M840 150 q10 -10 20 0 q10 -10 20 0"/>
    <path d="M980 210 q8 -8 16 0 q8 -8 16 0"/>
  </g>

  <text x="600" y="180" text-anchor="middle" font-family="Arial Black, Arial" font-size="62" font-weight="900" fill="#fff7ed" letter-spacing="4">INDIE SUNRISE</text>
  <text x="600" y="245" text-anchor="middle" font-family="Arial" font-size="34" font-weight="700" fill="#fff7ed" letter-spacing="12">FESTIVAL</text>
</svg>
